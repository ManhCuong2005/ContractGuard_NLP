[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contractguard"
version = "0.1.0"
description = "Offline Vietnamese contract clause risk detection — MVP 1 only"
requires-python = ">=3.11,<3.13"
dependencies = ["scikit-learn==1.6.1", "joblib>=1.2,<2"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
collection = ["pypdf==5.9.0", "requests==2.32.5", "beautifulsoup4==4.14.2"]
annotation = ["pdfplumber==0.11.9"]
experiments = ["matplotlib==3.11.2"]

[project.scripts]
contractguard = "contractguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
